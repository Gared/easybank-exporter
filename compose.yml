services:
  app:
    image: node:lts-slim
    volumes:
      - .:/app
    env_file:
      - .env
      - path: .env.local
        required: false

    working_dir: /app
    command: node index.mjs
    depends_on:
      browserless:
        condition: service_healthy
  browserless:
    image: ghcr.io/browserless/chromium:latest
    environment:
      - DATA_DIR=/data
    volumes:
      - ./browser-profiles:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/pressure | grep -q '\"isAvailable\": true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
